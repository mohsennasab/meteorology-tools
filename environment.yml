# Conda environment for local use and for mybinder.org (repo2docker auto-detects this file).
# Versions are left unpinned so Binder can solve quickly; the stack below was developed and
# tested with the versions noted in the README ("Tested with").
name: meteorology-tools
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy=2.5.1
  - pandas=3.0.3
  - scipy=1.18.0
  - geopandas=1.1.4
  - shapely=2.1.2
  - geos=3.14.1
  - proj=9.7.1
  - proj-data=1.24
  - rasterio=1.5.0
  - pyproj=3.7.2
  - matplotlib=3.11.1
  - matplotlib-scalebar=0.9.0
  - contextily=1.7.1
  - mapclassify=2.10.0
  - jupyterlab=4.6.2
  - notebook=7.6.1
  - dask=2026.7.1
  - fiona=1.10.1
  - ipykernel=7.3.0
  - pip=26.1.2
  - pyarrow=25.0.0
  - pytest=9.1.1
  - requests=2.34.2
  - rioxarray=0.22.0
  - ruff=0.15.22
  - xarray=2026.7.0
  - zarr=3.2.1
  - pip:
    - pystac==1.15.1
    - dataretrieval==1.2.0
    - duckdb==1.5.5
    - nbconvert==7.17.1
    - boto3==1.43.55
    - leafmap==0.63.0
    - netcdf4==1.7.4
    - s3fs==0.4.2
    - hecdss==0.1.29
    - python-dotenv==1.2.2
    - stac_geoparquet==0.8.1
